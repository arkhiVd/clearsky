name: deploy

# Push to main: test -> terraform apply -> bake config.js from outputs ->
# sync the static site to S3 -> invalidate CloudFront. OIDC only, no keys.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: clearsky-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip -q install pytest boto3
          python -m pytest tests/ -q

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_scan_regions: "auto"
        run: |
          terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve

      - name: Bake config.js from terraform outputs
        working-directory: terraform
        run: |
          cat > ../web/config.js <<EOF
          // generated by CI from terraform outputs
          const CONFIG = {
            region: "us-east-1",
            clientId: "$(terraform output -raw cognito_client_id)",
            accountId: "$(aws sts get-caller-identity --query Account --output text)",
          };
          EOF

      - name: Sync site to S3
        working-directory: terraform
        run: |
          BUCKET=$(terraform output -raw site_bucket)
          aws s3 sync ../web "s3://$BUCKET" --delete \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront
        working-directory: terraform
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Show dashboard URL
        working-directory: terraform
        run: terraform output dashboard_url
